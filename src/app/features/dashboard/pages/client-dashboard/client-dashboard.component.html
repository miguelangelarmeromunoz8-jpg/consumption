<h2>Mis Tickets</h2>

<app-loading-spinner *ngIf="isLoading"></app-loading-spinner>
<app-error-message *ngIf="errorMessage" [message]="errorMessage"></app-error-message>

<div *ngIf="!isLoading && !errorMessage">
  <div class="header-actions">
    <a mat-raised-button color="primary" routerLink="/tickets/new">Crear nuevo ticket</a>
  </div>

  <p *ngIf="myTickets.length === 0">Aún no has creado ningún ticket.</p>

  <mat-card *ngFor="let ticket of myTickets" class="ticket-card">
    <mat-card-title>{{ ticket.title }}</mat-card-title>
    <mat-card-subtitle>
      Estado: {{ ticket.status }} · Prioridad: {{ ticket.priority }}
    </mat-card-subtitle>
    <mat-card-actions>
      <a mat-button [routerLink]="['/tickets', ticket.id]">Ver detalle</a>
    </mat-card-actions>
  </mat-card>
</div>
